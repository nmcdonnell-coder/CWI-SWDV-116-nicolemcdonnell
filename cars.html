<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nicole's Car Rentals Cars">
    <title>Nicole's Car Rentals Cars</title>
    <link rel="icon" type="image/x-icon" href="https://zany.sh/favicon.svg?text=NM">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <h1><a href="index.html">Nicole's Car Rentals</a></h1>
    <nav class="topnav" id="myTopnav">
        <a href="cars.html"><i class="fa fa-car"></i> Available Cars</a>
        <a href="testimonials.html"><i class="fa fa-comments"></i> Testimonials</a>
        <a href="about.html"><i class="fa fa-user"></i> About Me</a>
        <a href="contact.html"><i class="fa fa-envelope"></i> Contact The Owner</a>
        <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            <i class="fa fa-bars"></i>
        </a>
    </nav>
    </header>
    <main>
        <section class="featured-cars">
            <h2>Available Cars</h2>
            <div class="car-container"></div>
            <dialog id="rentalDialog">
                <h2>Confirm Your Rental</h2>
                <p id="rentalDetails"></p>
                <button id="confirmButton">Confirm</button>
                <button id="cancelButton">Cancel</button>
            </dialog>
        </section>
    </main>
    <footer>
        <p>&copy; 2026</p>
    </footer>
    <script src="main.js"></script>
    <script>
        let rentalInfo;
        const rentalDialog = document.getElementById("rentalDialog");
        const rentalDetails = document.getElementById("rentalDetails");
        const confirmButton = document.getElementById("confirmButton");
        const cancelButton = document.getElementById("cancelButton");
        document.addEventListener("confirm-rental", function(event) {
            rentalInfo = event.detail;
            rentalDetails.textContent =
                "Car Type: " + rentalInfo.carType +
                " | Start Date: " + rentalInfo.startDate +
                " | Return Date: " + rentalInfo.returnDate;
            rentalDialog.showModal();
        });
        confirmButton.addEventListener("click", function() {
            rentalDialog.close();
            console.log("Rental confirmed:", rentalInfo);
        });
        cancelButton.addEventListener("click", function() {
            rentalDialog.close();
        });
        document.addEventListener("DOMContentLoaded", function() {
            listCars();
        });
    </script>
</body>
</html>
